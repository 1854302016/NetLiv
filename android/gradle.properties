org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Workaround for Kotlin incremental-compiler crash on Windows when the pub-cache
# drive (e.g. C:) differs from the project drive (e.g. D:): the relative-path
# computation used by the incremental cache throws IllegalArgumentException
# ("different roots") across drive letters. Disabling incremental compilation
# avoids that code path entirely.
kotlin.incremental=false
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
